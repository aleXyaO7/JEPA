cache_dir: null
solver:
  _target_: stable_worldmodel.planning.solver.CEMSolver
  cost: ???
  batch_size: 1
  num_samples: 300
  var_scale: 1.0
  n_steps: 30
  topk: 30
  device: cuda
  seed: ${seed}
objective:
  _target_: stable_worldmodel.planning.GoalMSE
world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ???
seed: 42
policy: lewm-tworooms
plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5
dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
  - action
  - proprio
eval:
  num_eval: 50
  goal_offset_steps: 50
  eval_budget: 100
  img_size: 224
  dataset_name: tworoom.h5
  callables:
  - method: _set_state
    args:
      state:
        value: pos_agent
  - method: _set_goal_state
    args:
      goal_state:
        value: goal_pos_agent
output:
  filename: tworoom_offset50_results.txt
